name: Verify i18n Translations

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/i18n/**'
      - 'scripts/generate_i18n.py'
      - '.github/workflows/update-i18n.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/i18n/**'
      - 'scripts/generate_i18n.py'
      - '.github/workflows/update-i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate i18n files
        run: python3 scripts/generate_i18n.py

      - name: Verify generated translations are current
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import scripts.generate_i18n as generator
          expected = {f"docs/i18n/README_{code}.md" for code in generator.LANGS}
          tracked = set(subprocess.check_output(
              ["git", "ls-files", "--", "docs/i18n/README_*.md"], text=True
          ).splitlines())
          if expected != tracked:
              raise SystemExit("Generated README filenames do not match the tracked language set.")
          PY
          generated_changes=$(git status --porcelain --untracked-files=all -- docs/i18n/)
          if [ -n "$generated_changes" ]; then
            echo "::error::Generated translations are stale. Run 'python3 scripts/generate_i18n.py' and commit docs/i18n/."
            exit 1
          fi
