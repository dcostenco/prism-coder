name: MCP Registry Publish
# Root cause of the 1.5.0→20.6.0 registry drift: publishing was fully manual
# and nothing ever republished after the initial listing. This workflow keeps
# the registry listing following releases via GitHub OIDC (no stored secrets —
# the registry validates namespace ownership against this repository).
#
# It runs on the release TAG, not on main. The registry refuses to list a
# version whose npm package does not exist yet:
#
#   registry validation failed for package 0 (prism-mcp-server): NPM package
#   'prism-mcp-server' exists, but version '20.19.0' was not found (404)
#
# The old `push: branches[main], paths[server.json]` trigger fired the moment
# a release PR merged — always BEFORE publish.yml had run, because that one
# only fires on `v*`. It therefore could not succeed, and it silently failed
# that way for 20.18.2 and 20.19.0 while the listing sat two releases behind
# at 20.18.1: exactly the drift this workflow exists to prevent. The tag is
# the real release event, and registry versions are immutable anyway, so a
# metadata-only merge to main had nothing to publish.
on:
  push:
    tags:
      - "v*"
  # Recovery path: re-run against main after npm has the version, which is how
  # a listing that missed its tag gets caught up.
  workflow_dispatch:

# One run per ref. GitHub delivered TWO runs of every publish workflow for the
# single v20.19.0 tag push (2026-09-15: same head SHA ffa76fa6, both attempt 1).
# Here both duplicates were merely wasteful rather than red — each sat through
# the npm wait below for five minutes, and the second was absorbed by the
# duplicate-version tolerance in the publish step. The npm workflows were not
# so lucky: their two runs raced and the loser died on E409. Serializing costs
# nothing and keeps a second run from burning ten minutes of wait to no end.
# Queue rather than cancel: cancelling a run mid-publish is worse than making
# it wait.
concurrency:
  group: registry-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC login to the MCP registry
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `||` fallback: the fallback only compared top-level versions, so a
      # stale packages[].version failed the real guard and then PASSED the
      # fallback — a publish gate that fails open is not a gate.
      - name: Guard — manifest must match package.json
        run: node scripts/check-publish-clean.mjs --manifest-only
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          # Pinned + checksum-verified: this job holds id-token: write for the
          # registry namespace, so an unpinned `latest` tarball would run
          # arbitrary future code with publish credentials.
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz
          sudo mv mcp-publisher /usr/local/bin/
      # Ordering alone is not enough: publish.yml fires on the same tag push,
      # so the two jobs start together, and npm needs a moment to serve a
      # freshly published version. Wait for the exact coordinates the registry
      # will validate — read from server.json so this can never drift from
      # what mcp-publisher sends.
      - name: Wait for npm to serve the version the registry validates
        run: |
          pkg=$(node -p "require('./server.json').packages[0].identifier")
          ver=$(node -p "require('./server.json').packages[0].version")
          echo "Waiting for ${pkg}@${ver} on npm..."
          for attempt in $(seq 1 40); do
            if npm view "${pkg}@${ver}" version >/dev/null 2>&1; then
              echo "✓ ${pkg}@${ver} is on npm (attempt ${attempt})"
              exit 0
            fi
            echo "  not yet (attempt ${attempt}/40); sleeping 15s"
            sleep 15
          done
          echo "::error::${pkg}@${ver} never appeared on npm after 10 minutes."
          echo "The registry would reject this listing with a 404. Check the"
          echo "Publish Package workflow for this tag, then re-run this one."
          exit 1
      - name: Publish to MCP Registry
        # Registry versions are immutable: a server.json change without a
        # version bump (description edits, metadata) always gets 400
        # "cannot publish duplicate version". That is the expected outcome for
        # a metadata-only merge — the change rides the next release — not a
        # failure. Verified 2026-08-06: a description-only merge produced a
        # red X that read as "publish broken" while nothing was wrong. Only
        # the duplicate-version rejection is tolerated; every other error
        # still fails the job.
        run: |
          mcp-publisher login github-oidc
          set +e
          output=$(mcp-publisher publish 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ $status -ne 0 ]; then
            if printf '%s' "$output" | grep -q "duplicate version"; then
              echo "::notice::Version already on the registry — metadata changes ride the next release. No-op."
              exit 0
            fi
            exit $status
          fi
